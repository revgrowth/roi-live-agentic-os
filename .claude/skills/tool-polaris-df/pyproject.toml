[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-df"
version = "0.1.0"
description = "Polaris Decision Fabric: typed TypeSafe Jev judgments for Search Command, audit, keyword, and QA."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ROI.LIVE / Polaris" }]

[project.optional-dependencies]
dev = []

[project.scripts]
polaris-df = "polaris_df.cli:main"

[tool.setuptools.packages.find]
include = ["polaris_df*"]
